[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akoma-markup"
version = "0.1.0"
description = "Convert legislative PDFs (from indiacode.nic.in) to Akoma Ntoso / Laws.Africa plaintext markup using any LangChain LLM."
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pdfplumber>=0.10",
    "langchain-core>=0.2",
    "click>=8.0",
    "pypdfium2>=4.25",
    "pillow>=10.0",
]

[project.optional-dependencies]
azure = ["langchain-azure-ai", "langchain-openai"]
anthropic = ["langchain-anthropic"]
vision = [
    "azure-ai-inference>=1.0",
    "anthropic>=0.25",
    "aiohttp>=3.9",
    "tenacity>=8.2",
]
all = [
    "langchain-azure-ai",
    "langchain-openai",
    "langchain-anthropic",
    "azure-ai-inference>=1.0",
    "anthropic>=0.25",
    "aiohttp>=3.9",
    "tenacity>=8.2",
]

[project.scripts]
akoma-markup = "akoma_markup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
